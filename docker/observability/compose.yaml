name: anonresume-observability

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.23
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9600/_node/pipelines/main"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${LOGSTASH_GELF_PORT:-12201}:12201/udp"
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    mem_limit: 512m
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.23
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    mem_limit: 1g
    restart: unless-stopped

volumes:
  elasticsearch-data:
