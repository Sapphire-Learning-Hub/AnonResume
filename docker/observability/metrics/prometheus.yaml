global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: anonresume
    static_configs:
      - targets: [otel-collector:9464]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
