input {
  gelf {
    port => 12201
    use_udp => true
    use_tcp => false
  }
}

filter {
  json {
    source => "message"
    target => "[@metadata][anonresume]"
    tag_on_failure => ["_anonresume_json_failure"]
  }

  if "_anonresume_json_failure" in [tags] {
    ruby {
      code => '
        event.to_hash.keys.each do |key|
          event.remove(key) unless key == "@timestamp" || key == "@version"
        end
      '
    }

    mutate {
      replace => { "message" => "Malformed application log received" }
      add_field => {
        "event.action" => "malformed_log_received"
        "event.dataset" => "anonresume.dead_letter"
        "event.outcome" => "failure"
        "[@metadata][target_dataset]" => "anonresume.dead_letter"
      }
    }
  } else {
    ruby {
      code => '
        parsed = event.get("[@metadata][anonresume]") || {}
        centralize = parsed["labels.centralize"]
        centralize = parsed.dig("labels", "centralize") if centralize.nil? && parsed["labels"].is_a?(Hash)
        if centralize == false
          event.cancel
        else
          event.to_hash.keys.each do |key|
            event.remove(key) unless key == "@timestamp" || key == "@version"
          end
          parsed.each do |key, value|
            event.set(key, value) unless key == "@timestamp"
          end
          event.set("[@metadata][target_dataset]", "anonresume.application")
        end
      '
    }

    date {
      match => ["[@metadata][anonresume][@timestamp]", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => ["_anonresume_timestamp_failure"]
    }
  }

  mutate {
    remove_field => [
      "full_message",
      "host",
      "command",
      "container_id",
      "container_name",
      "image_id",
      "image_name",
      "source_host",
      "tag",
      "version"
    ]
  }
}

output {
  if [@metadata][target_dataset] == "anonresume.dead_letter" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "anonresume.dead_letter"
      data_stream_namespace => "development"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "anonresume.application"
      data_stream_namespace => "development"
    }
  }
}
