name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BETTER_AUTH_SECRET: anonresume-ci-secret-for-tests-only
  BETTER_AUTH_URL: http://localhost:3000
  CONFIG_MASTER_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
  DATABASE_URL: postgresql://anonresume:anonresume@127.0.0.1:5432/anonresume_test

jobs:
  quality:
    name: quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check static quality
        run: bun run check:static
      - name: Build application
        run: bun run build

  unit_tests:
    name: unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: anonresume_test
          POSTGRES_PASSWORD: anonresume
          POSTGRES_USER: anonresume
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anonresume -d anonresume_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Initialize authentication database
        run: bun run auth:migrate -- --yes
      - name: Run unit test shard
        run: >-
          bun run test tests/unit tests/architecture tests/scripts
          --shard=${{ matrix.shard }}/3 --maxWorkers=1

  integration_tests:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: anonresume_test
          POSTGRES_PASSWORD: anonresume
          POSTGRES_USER: anonresume
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anonresume -d anonresume_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Initialize authentication database
        run: bun run auth:migrate -- --yes
      - name: Run integration tests
        run: bun run test tests/integration --maxWorkers=1

  verify:
    name: verify
    if: ${{ always() }}
    needs:
      - quality
      - unit_tests
      - integration_tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all checks passed
        env:
          INTEGRATION_RESULT: ${{ needs.integration_tests.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit_tests.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
