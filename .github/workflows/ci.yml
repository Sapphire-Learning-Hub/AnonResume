name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: anonresume-ci-secret
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://anonresume:anonresume@127.0.0.1:5432/anonresume_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: anonresume_test
          POSTGRES_PASSWORD: anonresume
          POSTGRES_USER: anonresume
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anonresume -d anonresume_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check project
        run: bun run check
      - name: Build application
        run: bun run build
