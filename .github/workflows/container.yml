name: Container Images

"on":
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANONRESUME_BUILD_COMMIT: ${{ github.sha }}
      ANONRESUME_BUILD_TAG: ci
      ANONRESUME_DEPLOYMENT_ID: ci
      ANONRESUME_IMAGE: anonresume-ci
      ANONRESUME_PDF_IMAGE: anonresume-pdf-ci
      ANONRESUME_PORT: "13000"
      ANONRESUME_VERSION: ci
      BETTER_AUTH_URL: https://resume.example.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Build and start deployment
        run: >-
          docker compose
          -f compose.yaml
          -f compose.build.yaml
          up -d --build --wait
      - name: Verify HTTP health
        run: |
          curl --fail --silent http://127.0.0.1:13000/api/health/live
          curl --fail --silent http://127.0.0.1:13000/api/health/ready
      - name: Verify PDF browser
        run: >-
          docker run --rm --entrypoint bun anonresume-pdf-ci:ci -e
          'import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          console.log(await browser.version());
          await browser.close();'
      - name: Scan core image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: anonresume-ci:ci
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
      - name: Scan PDF image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: anonresume-pdf-ci:ci
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
      - name: Show service logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.build.yaml logs --no-color
      - name: Stop deployment
        if: always()
        run: docker compose -f compose.yaml -f compose.build.yaml down --volumes --remove-orphans

  publish:
    name: publish ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            image: ghcr.io/sapphire-learning-hub/anonresume
            target: core-runtime
          - name: pdf
            image: ghcr.io/sapphire-learning-hub/anonresume-pdf
            target: pdf-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            ANONRESUME_BUILD_COMMIT=${{ github.sha }}
            ANONRESUME_BUILD_TAG=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
