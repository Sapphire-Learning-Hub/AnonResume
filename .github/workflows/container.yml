name: Container Images

"on":
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: build and smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANONRESUME_BUILD_COMMIT: ${{ github.sha }}
      ANONRESUME_BUILD_TAG: ci
      ANONRESUME_DEPLOYMENT_ID: ci
      ANONRESUME_IMAGE: anonresume-ci
      ANONRESUME_PDF_IMAGE: anonresume-pdf-ci
      ANONRESUME_PORT: "13000"
      ANONRESUME_VERSION: ci
      BETTER_AUTH_URL: https://resume.example.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Build and start deployment
        run: >-
          docker compose
          -f compose.yaml
          -f compose.build.yaml
          up -d --build --wait
      - name: Verify HTTP health
        run: |
          curl --fail --silent http://127.0.0.1:13000/api/health/live
          curl --fail --silent http://127.0.0.1:13000/api/health/ready
      - name: Verify PDF browser
        run: >-
          docker run --rm --entrypoint bun anonresume-pdf-ci:ci -e
          'import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          console.log(await browser.version());
          await browser.close();'
      - name: Scan core image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: anonresume-ci:ci
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
      - name: Scan PDF image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: anonresume-pdf-ci:ci
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
      - name: Show non-sensitive service logs
        if: failure()
        run: >-
          docker compose
          -f compose.yaml
          -f compose.build.yaml
          logs --no-color postgres migrate ai-worker pdf-worker
      - name: Stop deployment
        if: always()
        run: docker compose -f compose.yaml -f compose.build.yaml down --volumes --remove-orphans

  build:
    name: build release images (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TRIVY_PLATFORM: ${{ matrix.platform }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve core image metadata
        id: core-metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sapphire-learning-hub/anonresume
      - name: Build and publish core image
        id: build-core
        uses: docker/build-push-action@v7
        with:
          context: .
          target: core-runtime
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/sapphire-learning-hub/anonresume
          labels: ${{ steps.core-metadata.outputs.labels }}
          build-args: |
            ANONRESUME_BUILD_COMMIT=${{ github.sha }}
            ANONRESUME_BUILD_TAG=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/sapphire-learning-hub/anonresume,push-by-digest=true,name-canonical=true,push=true
      - name: Resolve PDF image metadata
        id: pdf-metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sapphire-learning-hub/anonresume-pdf
      - name: Build and publish PDF image
        id: build-pdf
        uses: docker/build-push-action@v7
        with:
          context: .
          target: pdf-runtime
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/sapphire-learning-hub/anonresume-pdf
          labels: ${{ steps.pdf-metadata.outputs.labels }}
          build-args: |
            ANONRESUME_BUILD_COMMIT=${{ github.sha }}
            ANONRESUME_BUILD_TAG=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=release-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/sapphire-learning-hub/anonresume-pdf,push-by-digest=true,name-canonical=true,push=true
      - name: Scan core platform image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/sapphire-learning-hub/anonresume@${{ steps.build-core.outputs.digest }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
      - name: Scan PDF platform image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/sapphire-learning-hub/anonresume-pdf@${{ steps.build-pdf.outputs.digest }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
      - name: Export image digests
        run: |
          mkdir -p "${RUNNER_TEMP}/digests/core" "${RUNNER_TEMP}/digests/pdf"
          core_digest="${{ steps.build-core.outputs.digest }}"
          pdf_digest="${{ steps.build-pdf.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/core/${core_digest#sha256:}"
          touch "${RUNNER_TEMP}/digests/pdf/${pdf_digest#sha256:}"
      - name: Upload core image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-core-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/core/*
          if-no-files-found: error
          retention-days: 1
      - name: Upload PDF image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-pdf-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/pdf/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish ${{ matrix.name }} manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            image: ghcr.io/sapphire-learning-hub/anonresume
          - name: pdf
            image: ghcr.io/sapphire-learning-hub/anonresume-pdf
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long
      - name: Create and verify multi-platform manifest
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          sources=()
          for digest in "${RUNNER_TEMP}"/digests/*; do
            sources+=("${{ matrix.image }}@sha256:$(basename "${digest}")")
          done

          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            "${sources[@]}"

          release_image="$(jq -r '.tags[0]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")"
          manifest="$(docker buildx imagetools inspect --raw "${release_image}")"
          jq -e '
            any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
          ' <<< "${manifest}"

  verify:
    name: verify published images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      ANONRESUME_DEPLOYMENT_ID: ci-release
      ANONRESUME_IMAGE: ghcr.io/sapphire-learning-hub/anonresume
      ANONRESUME_PDF_IMAGE: ghcr.io/sapphire-learning-hub/anonresume-pdf
      ANONRESUME_PORT: "13000"
      ANONRESUME_VERSION: ${{ github.ref_name }}
      BETTER_AUTH_URL: https://resume.example.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and start published deployment
        run: docker compose up -d --pull always --wait
      - name: Verify HTTP health
        run: |
          curl --fail --silent http://127.0.0.1:13000/api/health/live
          curl --fail --silent http://127.0.0.1:13000/api/health/ready
      - name: Verify PDF browser
        run: >-
          docker run --rm --entrypoint bun
          "${ANONRESUME_PDF_IMAGE}:${ANONRESUME_VERSION}" -e
          'import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          console.log(await browser.version());
          await browser.close();'
      - name: Show non-sensitive service logs
        if: failure()
        run: >-
          docker compose logs --no-color postgres migrate ai-worker pdf-worker
      - name: Stop deployment
        if: always()
        run: docker compose down --volumes --remove-orphans
