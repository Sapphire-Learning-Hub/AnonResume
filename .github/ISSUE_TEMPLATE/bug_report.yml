name: Bug report
description: Report reproducible behavior that prevents AnonResume from working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, private addresses, or real user data. Report security vulnerabilities through the private security link below instead.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing Issues and did not find the same problem.
          required: true
        - label: This report contains no credentials, private addresses, or real user data.
          required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observable behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AnonResume version or commit
      placeholder: v1.1.2 or a commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, deployment method, and other relevant details.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized logs, screenshots, or recordings when useful.
      render: shell
